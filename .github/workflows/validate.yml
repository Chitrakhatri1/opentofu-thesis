      - run: terraform init -backend=false
      - run: terraform validate

  enterprise-aws-opentofu:
    name: Enterprise AWS OpenTofu validation
    runs-on: ubuntu-latest
    env:
      TF_DATA_DIR: .tofu-data
    defaults:
      run:
        working-directory: enterprise-lite/aws/environments/aws-enterprise-lite
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
