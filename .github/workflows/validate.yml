      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.7
      - run: tofu init -backend=false
      - run: tofu validate

  gcp-terraform:
    name: GCP Terraform validation
    runs-on: ubuntu-latest
