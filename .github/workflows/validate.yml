      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.7
      - run: tofu init -backend=false
      - run: tofu validate

  enterprise-gcp-terraform:
    name: Enterprise GCP Terraform validation
    runs-on: ubuntu-latest
    env:
